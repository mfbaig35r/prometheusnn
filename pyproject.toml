[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheusnn"
version = "1.0.0"
description = "Frictionless hierarchical text classification — an MCP server that guides you from CSV to trained classifier"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fahad Baig", email = "mfbaig35r@gmail.com"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/mfbaig35r/prometheusnn"
Repository = "https://github.com/mfbaig35r/prometheusnn"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
]

[project.scripts]
prometheusnn = "prometheus.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B905",    # zip() strict= — internal iterables, lengths always match
    "SIM102",  # nested ifs — often more readable than combined
    "E501",    # line length — handled by formatter for code; docstrings exempt
]

