[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheusnn"
version = "1.0.0"
description = "Generalized N-level hierarchical cascade classifier MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "pandas>=2.0",
]

[project.scripts]
prometheusnn = "prometheus.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B905",    # zip() strict= — internal iterables, lengths always match
    "SIM102",  # nested ifs — often more readable than combined
    "E501",    # line length — handled by formatter for code; docstrings exempt
]

[dependency-groups]
dev = [
    "duckdb>=1.4.4",
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]
