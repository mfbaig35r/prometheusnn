[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheusnn"
version = "1.0.0"
description = "Generalized N-level hierarchical cascade classifier MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "pandas>=2.0",
]

[project.scripts]
prometheusnn = "prometheus.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "duckdb>=1.4.4",
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
]
